# Modèle de score « Mushroom Finder »
# score(espèce) = 100 × score_essence(espèce) × score_météo(espèce)
# Tous les seuils sont modifiables ici sans toucher au code (redémarrer le backend).
#
# Les courbes "points" sont des interpolations linéaires [[x, valeur], ...] :
# en dessous du premier x on garde la première valeur, au-dessus du dernier la dernière.
#
# Valeurs de départ heuristiques (écologie générale des espèces), NON calibrées
# sur des récoltes réelles : à ajuster.

# ---------------------------------------------------------------------------
# 1. Catégories d'essences (le rattachement code TFV -> catégorie est dans tfv_mapping.yaml)
#    group = regroupement utilisé par le filtre de l'interface.
# ---------------------------------------------------------------------------
essence_categories:
  chene:                  { label: "Chênes",                     group: "Chênes" }
  chene_vert:             { label: "Chênes verts / lièges",      group: "Chênes" }
  hetre:                  { label: "Hêtre",                      group: "Hêtre" }
  chataignier:            { label: "Châtaignier",                group: "Châtaignier" }
  sapin_epicea:           { label: "Sapin, épicéa",              group: "Sapin / épicéa" }
  pin:                    { label: "Pins",                       group: "Pins" }
  pin_alep:               { label: "Pin d'Alep",                 group: "Pins" }
  mixte:                  { label: "Mélange feuillus-conifères", group: "Mélanges" }
  melange_feuillus:       { label: "Mélange de feuillus",        group: "Mélanges" }
  feuillus_indetermines:  { label: "Feuillus (îlots)",           group: "Mélanges" }
  coniferes_indetermines: { label: "Conifères divers",           group: "Mélanges" }
  foret_ouverte:          { label: "Forêt ouverte",              group: "Mélanges" }
  feuillus_autres:        { label: "Autre feuillu",              group: "Autres" }
  meleze:                 { label: "Mélèze",                     group: "Autres" }
  douglas:                { label: "Douglas (exotique)",         group: "Autres" }
  robinier:               { label: "Robinier",                   group: "Autres" }
  peupleraie:             { label: "Peupleraie",                 group: "Autres" }
  sans_couvert:           { label: "Sans couvert arboré",        group: "Autres" }
  lande:                  { label: "Lande / herbacée",           group: "Autres" }

# Seuil au-dessus duquel l'essence est affichée « ✓ »
essence_ok_threshold: 0.6

# ---------------------------------------------------------------------------
# 2. Météo par défaut (chaque espèce peut surcharger un facteur entier)
#    Fenêtre principale : les 7 derniers jours complets (J-7 … J-1).
#    Fenêtre « pluie ancienne » : J-12 … J-8 (pousse décalée de 7 à 12 jours).
# ---------------------------------------------------------------------------
weather_defaults:
  main_window_days: 7
  lag_window: { from_day: 12, to_day: 8 }   # J-12 à J-8 inclus

  # Cumul de pluie sur 7 jours (mm) -> facteur 0..1
  rain_7d:
    points: [[0, 0.05], [10, 0.25], [20, 1.0], [60, 1.0], [100, 0.55], [150, 0.25]]
    ok_range: [20, 60]

  # Température moyenne 7 j (°C) : sol 0-7 cm si dispo, sinon air à 2 m -> facteur 0..1
  temperature:
    prefer: soil            # soil | air
    points: [[0, 0.0], [5, 0.15], [10, 1.0], [18, 1.0], [22, 0.4], [28, 0.05]]
    ok_range: [10, 18]

  # Gel : température minimale de l'air sur 7 j -> multiplicateur
  frost:
    points: [[-5, 0.1], [-2, 0.25], [0, 0.45], [0.5, 1.0]]

  # Humidité du sol moyenne 7 j (m³/m³, 0-7 cm) -> multiplicateur (bonus si humide)
  soil_moisture:
    points: [[0.10, 0.8], [0.20, 1.0], [0.30, 1.15], [0.40, 1.2]]
    ok_min: 0.25

  # Pluie ancienne (J-12…J-8) suivie de temps doux -> bonus
  lagged_rain:
    min_rain_mm: 20
    mild_temp_range: [10, 18]  # température moyenne 7 j
    bonus: 1.2

# ---------------------------------------------------------------------------
# 3. Espèces
#    essences : score 0..1 par catégorie (catégorie absente = 0)
#    weather  : facteurs météo qui remplacent ceux de weather_defaults
#    season   : multiplicateur par mois (1 = janvier)
#    lookalikes : sosies à connaître (danger: mortel | toxique | faible)
# ---------------------------------------------------------------------------
